# Overrides of detekt's default rule set only (buildUponDefaultConfig is on); each one says why.
# There is no baseline: fix findings rather than suppress them.

style:
  MagicNumber:
    # Dp/sp sizes, colours and map geometry inside composables and the theme read better inline, and
    #  test fixtures use literal values on purpose. Everything else needs a named constant.
    ignoreAnnotated: ['Composable']
    ignoreRanges: true
    # Unit conversions (minutes, hours, percent, milliseconds) are not magic.
    ignoreNumbers: ['-1', '0', '1', '2', '3', '10', '24', '60', '100', '1000', '3600', '3_600_000']
    excludes:
      - '**/test/**'
      - '**/androidHostTest/**'
      - '**/commonTest/**'
      - '**/androidTest/**'
      - '**/ui/theme/**'
  ForbiddenComment:
    comments:
      - 'FIXME:'
      - 'STOPSHIP:'

naming:
  FunctionNaming:
    # Composables and the iOS entry point are PascalCase by convention.
    ignoreAnnotated: ['Composable']
    excludes:
      - '**/iosMain/**'
