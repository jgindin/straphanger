name: Straphanger KMP CI (Android, Emulator UI Tests & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-and-apk-build:
    name: Shared Unit Tests & Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Shared KMP Unit Tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Straphanger Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: straphanger-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  android-emulator-tests:
    name: Android Emulator Instrumented Compose UI Tests
    runs-on: ubuntu-latest
    needs: unit-and-apk-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI Tests on Android Emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest --stacktrace

  ios-simulator-build-and-test:
    name: iOS Simulator Framework & KMP Tests
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run KMP Tests on iOS Simulator (Arm64)
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Link iOS Simulator Debug Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
