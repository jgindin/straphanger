name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish to Play internal testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Check the tag matches version.properties
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName=$file_version in version.properties" >&2
            exit 1
          fi

      - name: Check the store listing
        run: scripts/check-listing.sh

      - name: Decode the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "STRAPHANGER_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Run tests and lint, then build the release bundle
        env:
          STRAPHANGER_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          STRAPHANGER_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          STRAPHANGER_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :shared:testAndroidHostTest :androidApp:lintRelease :androidApp:bundleRelease --stacktrace

      - name: Publish to the internal testing track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          STRAPHANGER_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          STRAPHANGER_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          STRAPHANGER_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          STRAPHANGER_PLAY_CREDENTIALS="$RUNNER_TEMP/play.json" ./gradlew :androidApp:publishReleaseBundle --stacktrace

      - name: Upload the bundle and R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: straphanger-release-${{ github.ref_name }}
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
