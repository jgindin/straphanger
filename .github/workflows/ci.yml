name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every check that runs on the JVM: formatting, static analysis, all host tests (commonTest and the
  #  Robolectric Compose tests in androidHostTest), the GTFS generator's tests, the coverage minimum,
  #  a debug build and Android lint.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the Gradle wrapper's checksum, and caches Gradle state between runs.
      - uses: gradle/actions/setup-gradle@v6
      # Before the tests so that a formatting or static-analysis finding fails the job in seconds. Run
      #  ./gradlew ktfmtFormat to fix the formatting locally.
      - name: Check Kotlin formatting, static analysis and the iOS version file
        run: ./gradlew ktfmtCheck detekt checkIosVersion
      - name: Run tests, check coverage, build the debug APK and run lint
        run: ./gradlew :shared:testAndroidHostTest :tools:gtfs-import:test koverVerify :androidApp:assembleDebug :androidApp:lintDebug
      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: straphanger-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: warn
      - name: Upload test, coverage, lint and detekt reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/kover/**
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/**

  # The instrumented Compose UI tests in androidApp/src/androidTest on an API 34 emulator. These cover
  #  what Robolectric cannot: real activity recreation, runtime permissions and the licenses screen.
  emulator-tests:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Hardware acceleration for the emulator: lets the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run instrumented tests on an emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest
      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  # The shared tests on the iOS simulator, and the simulator framework link.
  # Disabled: the macos-14 runner is not supported for this repository, so the job failed on
  # every run. Remove the `if` once a supported macOS runner is available.
  ios-tests:
    if: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the shared tests on the iOS simulator (arm64)
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Link the iOS simulator debug framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: '**/build/reports/tests/**'
